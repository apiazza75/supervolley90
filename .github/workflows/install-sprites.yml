name: Install generated volleyball sprite sheets

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/install-sprites.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Download and validate sprite archive
        env:
          SPRITES_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-32a8-8211-97d9-f922dc0770d5/raw?se=2026-08-05T12:25:40Z&sp=r&sv=2026-02-06&sr=b&scid=979e1a03-6401-56c7-8762-596617b5f22f&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T04:32:21Z&ske=2026-08-06T04:32:21Z&sks=b&skv=2026-02-06&sig=3V9z81018wxFZF%2BXthQVyIS/W6HJKEokqJe0hivKFR8%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors "$SPRITES_URL" -o /tmp/supervolley-sprites.zip
          unzip -t /tmp/supervolley-sprites.zip
          mkdir -p public/sprites
          unzip -o /tmp/supervolley-sprites.zip -d public/sprites

          expected=(spike.png approach.png block.png bump.png set.png dive.png serve.png jumpServe.png celebrate.png)
          for file in "${expected[@]}"; do
            test -s "public/sprites/$file"
            file "public/sprites/$file" | grep -q 'PNG image data'
          done

      - name: Commit the nine final sheets to this branch
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Sprite Installer"
          git config user.email "noreply@openai.com"
          git add public/sprites/spike.png \
                  public/sprites/approach.png \
                  public/sprites/block.png \
                  public/sprites/bump.png \
                  public/sprites/set.png \
                  public/sprites/dive.png \
                  public/sprites/serve.png \
                  public/sprites/jumpServe.png \
                  public/sprites/celebrate.png
          git rm .github/workflows/install-sprites.yml
          git commit -m "Replace placeholder sprite sheets with final artwork"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary
