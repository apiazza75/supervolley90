name: Finalize illustrated Super Volley build

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/finalize-supervolley.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Apply replay fix, clean temporary paths and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply replay consistency fix and clean stale integration files
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replay = Path('src/game/replay.ts')
          text = replay.read_text(encoding='utf-8')
          old = "import { Side } from '../core/rules';\nimport { World } from '../core/world';"
          new = "import type { PlayerRole } from '../core/player';\nimport { Side } from '../core/rules';\nimport { World } from '../core/world';"
          if old in text:
              text = text.replace(old, new, 1)
          elif "import type { PlayerRole }" not in text:
              raise SystemExit('unexpected replay imports')

          old = "    side: Side;\n    pos: { x: number; y: number; z: number };"
          new = "    side: Side;\n    role: PlayerRole;\n    pos: { x: number; y: number; z: number };"
          if old in text:
              text = text.replace(old, new, 1)
          elif "    role: PlayerRole;" not in text:
              raise SystemExit('unexpected ReplayFrame player shape')

          old = "        side: p.side,\n        pos: { x: p.pos.x, y: p.pos.y, z: 0 },"
          new = "        side: p.side,\n        role: p.role,\n        pos: { x: p.pos.x, y: p.pos.y, z: 0 },"
          if old in text:
              text = text.replace(old, new, 1)
          elif "        role: p.role," not in text:
              raise SystemExit('unexpected replay capture shape')
          replay.write_text(text, encoding='utf-8')

          renderer = Path('src/render/renderer.ts')
          text = renderer.read_text(encoding='utf-8')
          old = "\n".join([
              "      const colors = world.team(rp.side).config.colors;",
              "      // Replay snapshots do not carry a role, so the libero keeps the team kit",
              "      // there. Adding one field to every recorded frame to recolour a shirt for",
              "      // two seconds is not worth the memory.",
              "      const proj = cam.project(rp.pos.x, rp.pos.y, rp.height);",
          ])
          new = "\n".join([
              "      const colors = world.team(rp.side).config.colors;",
              "      const proj = cam.project(rp.pos.x, rp.pos.y, rp.height);",
          ])
          if old in text:
              text = text.replace(old, new, 1)

          old = "\n".join([
              "        draw: () => {",
              "          drawPlayerShadow(ctx, cam, ghost);",
              "          drawPlayer(ctx, cam, ghost, colors, { active: false, charge: 0, time, dt });",
              "        },",
          ])
          new = "\n".join([
              "        draw: () => {",
              "          drawPlayerShadow(ctx, cam, ghost);",
              "          const kit = kitFor(ghost, colors);",
              "          if (this.useSprites && drawSpritePlayer(ctx, cam, ghost, this.sheets, dt, kit[0])) {",
              "            return;",
              "          }",
              "          drawPlayer(ctx, cam, ghost, kit, { active: false, charge: 0, time, dt });",
              "        },",
          ])
          if old in text:
              text = text.replace(old, new, 1)
          elif "drawSpritePlayer(ctx, cam, ghost" not in text:
              raise SystemExit('unexpected replay renderer body')

          text = text.replace(
              "the bodies and the ball: no markers, no cues, no gauges —\n   * a replay is for watching, not for playing. The recorded players are cast\n   * to `Player` because `drawPlayer` only ever reads the fields a snapshot\n   * carries.",
              "the bodies and the ball: no markers, no cues, no gauges —\n   * a replay is for watching, not for playing. Recorded poses use the same\n   * illustrated sheets and kit remapping as live play, with the vector figure\n   * retained as the safe fallback.",
              1,
          )
          renderer.write_text(text, encoding='utf-8')

          arena = Path('src/render/arena.ts').read_text(encoding='utf-8')
          if "import { ArenaArtwork } from './arena-art';" not in arena:
              raise SystemExit('tested ArenaArtwork integration is missing')
          if "ArenaAssets" in arena:
              raise SystemExit('two arena loaders are wired at once')

          # A later parallel attempt added an unused second loader. Keep the
          # implementation that already passed rendered screenshots and macOS build.
          Path('src/render/arena-assets.ts').unlink(missing_ok=True)
          Path('.github/workflows/fix-replay-sprites.yml').unlink(missing_ok=True)
          Path('.github/workflows/wire-arena-assets.yml').unlink(missing_ok=True)
          PY

      - name: Validate assets, code, tests, build and simulation
        run: |
          set -euo pipefail
          npm ci
          npm run assets:check
          npm run typecheck
          npm test
          npm run build
          npm run sim -- --matches 2 --seed 1337

      - name: Capture final rendered verification
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run shots -- /tmp/supervolley-final-shots

      - uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-final-rendered-screenshots
          path: /tmp/supervolley-final-shots/*.png
          if-no-files-found: error

      - name: Commit final verified implementation
        run: |
          set -euo pipefail
          git config user.name "Codex Final Verification"
          git config user.email "noreply@openai.com"
          git add -A
          git rm .github/workflows/finalize-supervolley.yml
          git commit -m "Finalize illustrated sprites, replay and arena integration"
          git fetch origin claude/volley-2d-macos-game-cl9ary
          git rebase origin/claude/volley-2d-macos-game-cl9ary
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary

  macos-final:
    name: Build, sign and package final macOS app
    needs: finalize
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate and build Tauri application
        run: |
          set -euo pipefail
          npm ci
          npm run assets:check
          npm run app:build

      - name: Ad-hoc sign, verify and package
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          app="macos/Super Volley 90.app"
          test -d "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p final-dmg
          hdiutil create -volname "Super Volley 90" -srcfolder "$app" \
            -ov -format UDZO final-dmg/SuperVolley90.dmg
          tar -czf SuperVolley90-macos-app.tar.gz -C macos "Super Volley 90.app"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-final-macos-build
          path: |
            src-tauri/target/release/bundle/final-dmg/SuperVolley90.dmg
            src-tauri/target/release/bundle/SuperVolley90-macos-app.tar.gz
          if-no-files-found: error
