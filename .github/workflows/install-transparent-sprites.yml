name: Install final transparent volleyball sprites

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/install-transparent-sprites.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Download and validate final sprite archive
        env:
          SPRITES_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-2e4c-81f4-8ae2-734c5c140fa7/raw?se=2026-08-05T21:35:58Z&sp=r&sv=2026-02-06&sr=b&scid=e440dd5f-bec4-5f89-886a-79385ed78e1a&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T06:06:40Z&ske=2026-08-06T06:06:40Z&sks=b&skv=2026-02-06&sig=jPVinDkB3COmruEB86pPp2tmDQ4in9Wqe8HEnHjfyEE%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors "$SPRITES_URL" -o /tmp/supervolley-transparent-sprites.zip
          unzip -t /tmp/supervolley-transparent-sprites.zip
          rm -rf /tmp/final-sprites
          mkdir -p /tmp/final-sprites public/sprites
          unzip -o /tmp/supervolley-transparent-sprites.zip -d /tmp/final-sprites

          python3 <<'PY'
          from pathlib import Path
          import struct

          expected = [
              'idle.png', 'approach.png', 'spike.png', 'block.png', 'bump.png',
              'set.png', 'dive.png', 'serve.png', 'jumpServe.png', 'celebrate.png',
          ]
          root = Path('/tmp/final-sprites')
          found = sorted(p.name for p in root.glob('*.png'))
          assert found == sorted(expected), (found, expected)
          for name in expected:
              data = (root / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              assert data[12:16] == b'IHDR', name
              width, height, bit_depth, colour_type = struct.unpack('>IIBB', data[16:26])
              assert (width, height) == (3072, 2048), (name, width, height)
              assert bit_depth == 8, (name, bit_depth)
              assert colour_type == 6, (name, colour_type)  # true RGBA
              assert len(data) > 100_000, (name, len(data))
              print(f'{name}: {width}x{height}, RGBA, {len(data)} bytes')
          PY

          cp /tmp/final-sprites/*.png public/sprites/

      - name: Commit ten transparent sheets
        run: |
          set -euo pipefail
          git config user.name "Codex Art Pipeline"
          git config user.email "noreply@openai.com"
          git add public/sprites/idle.png \
                  public/sprites/approach.png \
                  public/sprites/spike.png \
                  public/sprites/block.png \
                  public/sprites/bump.png \
                  public/sprites/set.png \
                  public/sprites/dive.png \
                  public/sprites/serve.png \
                  public/sprites/jumpServe.png \
                  public/sprites/celebrate.png
          git rm .github/workflows/install-transparent-sprites.yml
          git commit -m "Install final transparent player animation sheets"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary
