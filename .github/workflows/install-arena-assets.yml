name: Install illustrated arena assets

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/install-arena-assets.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Download and validate arena images
        env:
          ARENA_URL: https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6260-8246-a9fe-879a7de3fc16/raw?se=2026-08-06T01:09:51Z&sp=r&sv=2026-02-06&sr=b&scid=f8cb033e-888c-58d6-8d7f-db7ff0fb75fa&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T20:09:10Z&ske=2026-08-06T20:09:10Z&sks=b&skv=2026-02-06&sig=Yj4q81K0er9zKVFf/gSqJRAD1AifbG3xzOJ49b4ADxU%3D
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors "$ARENA_URL" -o /tmp/arena.zip
          rm -rf /tmp/arena
          mkdir -p /tmp/arena public/arena
          unzip -q -o /tmp/arena.zip -d /tmp/arena
          python3 -c "from pathlib import Path; import struct; expected={'arena-back.png':(2560,900),'arena-floor.png':(1024,512),'net.png':(512,512)}; root=Path('/tmp/arena'); [(lambda d,n,w,h: (d[:8]==b'\\x89PNG\\r\\n\\x1a\\n' or (_ for _ in ()).throw(AssertionError(n)), struct.unpack('>II',d[16:24])==(w,h) or (_ for _ in ()).throw(AssertionError((n,struct.unpack('>II',d[16:24]))))))((root/n).read_bytes(),n,w,h) for n,(w,h) in expected.items()]"
          cp /tmp/arena/*.png public/arena/

      - name: Commit arena images
        run: |
          set -euo pipefail
          git config user.name "Codex Arena Pipeline"
          git config user.email "noreply@openai.com"
          git add public/arena
          git rm .github/workflows/install-arena-assets.yml
          git commit -m "Add illustrated arena image assets"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary
