name: Install illustrated arena assets

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/install-arena-assets.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download and validate arena archive
        env:
          ARENA_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6260-8246-a9fe-879a7de3fc16/raw?se=2026-08-06T01:09:51Z&sp=r&sv=2026-02-06&sr=b&scid=f8cb033e-888c-58d6-8d7f-db7ff0fb75fa&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T20:09:10Z&ske=2026-08-06T20:09:10Z&sks=b&skv=2026-02-06&sig=Yj4q81K0er9zKVFf/gSqJRAD1AifbG3xzOJ49b4ADxU%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors "$ARENA_URL" -o /tmp/supervolley-arena.zip
          unzip -t /tmp/supervolley-arena.zip
          rm -rf /tmp/supervolley-arena
          mkdir -p /tmp/supervolley-arena public/arena
          unzip -o /tmp/supervolley-arena.zip -d /tmp/supervolley-arena
          cp /tmp/supervolley-arena/arena-back.png public/arena/arena-back.png
          cp /tmp/supervolley-arena/arena-floor.png public/arena/arena-floor.png
          cp /tmp/supervolley-arena/net.png public/arena/net.png

      - name: Add optional raster arena loader
        run: |
          cat > src/render/arena-assets.ts <<'TS'
          import { ANTENNA_HEIGHT, COURT_HALF_WIDTH, NET_HEIGHT } from '../core/rules';
          import type { Camera } from './camera';

          interface ScreenPoint {
            x: number;
            y: number;
          }

          function loadImage(url: string): Promise<HTMLImageElement | null> {
            if (typeof Image === 'undefined') return Promise.resolve(null);
            return new Promise((resolve) => {
              const image = new Image();
              image.onload = () => resolve(image);
              image.onerror = () => resolve(null);
              image.src = url;
            });
          }

          /**
           * Optional illustrated arena layers.
           *
           * Every method returns false while an asset is absent or still loading,
           * allowing the existing procedural arena to remain a complete fallback.
           */
          export class ArenaAssets {
            private back: HTMLImageElement | null = null;
            private floor: HTMLImageElement | null = null;
            private net: HTMLImageElement | null = null;

            constructor(base = 'arena') {
              if (typeof document !== 'undefined') void this.load(base);
            }

            private async load(base: string): Promise<void> {
              const url = (name: string): string =>
                new URL(`${base}/${name}`, document.baseURI).href;
              const [back, floor, net] = await Promise.all([
                loadImage(url('arena-back.png')),
                loadImage(url('arena-floor.png')),
                loadImage(url('net.png')),
              ]);
              this.back = back;
              this.floor = floor;
              this.net = net;
            }

            get hasFloor(): boolean {
              return this.floor !== null;
            }

            drawBackground(
              ctx: CanvasRenderingContext2D,
              width: number,
              height: number,
            ): boolean {
              const image = this.back;
              if (!image) return false;
              const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
              const dw = image.naturalWidth * scale;
              const dh = image.naturalHeight * scale;
              ctx.drawImage(image, (width - dw) / 2, height - dh, dw, dh);
              return true;
            }

            /** Fill one projected court quad with the horizontally tileable floor. */
            fillFloor(ctx: CanvasRenderingContext2D, points: ScreenPoint[]): boolean {
              const image = this.floor;
              if (!image || points.length < 3) return false;
              const xs = points.map((p) => p.x);
              const ys = points.map((p) => p.y);
              const left = Math.min(...xs);
              const right = Math.max(...xs);
              const top = Math.min(...ys);
              const bottom = Math.max(...ys);
              const height = Math.max(1, bottom - top);
              const tileHeight = Math.max(96, height * 1.12);
              const tileWidth = tileHeight * (image.naturalWidth / image.naturalHeight);

              ctx.save();
              ctx.beginPath();
              points.forEach((p, index) => {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
              });
              ctx.closePath();
              ctx.clip();
              for (let x = left - tileWidth; x < right + tileWidth; x += tileWidth) {
                ctx.drawImage(image, x, top, tileWidth, tileHeight);
              }
              ctx.restore();
              return true;
            }

            drawNet(ctx: CanvasRenderingContext2D, cam: Camera): boolean {
              const image = this.net;
              if (!image) return false;
              const widthAxis = COURT_HALF_WIDTH;
              const centre = cam.projectFloor(0, 0);
              const top = Math.min(
                cam.project(widthAxis, 0, ANTENNA_HEIGHT).y,
                cam.project(-widthAxis, 0, ANTENNA_HEIGHT).y,
              );
              const bottom = Math.max(
                cam.project(widthAxis, 0, 0).y,
                cam.project(-widthAxis, 0, 0).y,
              );
              const tapeNear = cam.project(-widthAxis, 0, NET_HEIGHT).y;
              const tapeFar = cam.project(widthAxis, 0, NET_HEIGHT).y;
              const projectedHeight = Math.max(1, bottom - top);
              const drawWidth = Math.max(48, Math.abs(tapeNear - tapeFar) * 0.92);
              ctx.drawImage(
                image,
                centre.x - drawWidth / 2,
                top,
                drawWidth,
                projectedHeight,
              );
              return true;
            }
          }
          TS

      - name: Wire arena assets into rendering
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/render/arena.ts')
          text = path.read_text(encoding='utf-8')

          old = "import { Camera } from './camera';"
          new = "import { Camera } from './camera';\nimport { ArenaAssets } from './arena-assets';"
          assert old in text
          text = text.replace(old, new, 1)

          old = "export class Arena {\n  private crowd: Spectator[] = [];"
          new = "export class Arena {\n  private readonly assets = new ArenaAssets();\n  private crowd: Spectator[] = [];"
          assert old in text
          text = text.replace(old, new, 1)

          old = """    // Flat fills, deliberately: gradients read as a lit 3D scene, and this
    // game is meant to read as a drawn 2D one.
    ctx.fillStyle = '#10182b';
    ctx.fillRect(0, 0, w, h);

    this.drawCrowd(ctx, cam, time);
    this.drawRoof(ctx, cam);
    this.drawShafts(ctx, cam, time);"""
          new = """    // Use the illustrated stand when it is available. Until it finishes
    // loading, the complete procedural arena remains the fallback.
    if (!this.assets.drawBackground(ctx, w, h)) {
      ctx.fillStyle = '#10182b';
      ctx.fillRect(0, 0, w, h);
      this.drawCrowd(ctx, cam, time);
      this.drawRoof(ctx, cam);
    }

    this.drawShafts(ctx, cam, time);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    fillQuad(
      ctx,
      cam,
      [
        [-COURT_HALF_WIDTH, -COURT_HALF_LENGTH],
        [COURT_HALF_WIDTH, -COURT_HALF_LENGTH],
        [COURT_HALF_WIDTH, 0],
        [-COURT_HALF_WIDTH, 0],
      ],
      COURT_NEAR,
    );
    fillQuad(
      ctx,
      cam,
      [
        [-COURT_HALF_WIDTH, 0],
        [COURT_HALF_WIDTH, 0],
        [COURT_HALF_WIDTH, COURT_HALF_LENGTH],
        [-COURT_HALF_WIDTH, COURT_HALF_LENGTH],
      ],
      COURT_NEAR,
    );

    this.drawGrain(ctx, cam, outX, outY);"""
          new = """    const nearCourt: [number, number][] = [
      [-COURT_HALF_WIDTH, -COURT_HALF_LENGTH],
      [COURT_HALF_WIDTH, -COURT_HALF_LENGTH],
      [COURT_HALF_WIDTH, 0],
      [-COURT_HALF_WIDTH, 0],
    ];
    const farCourt: [number, number][] = [
      [-COURT_HALF_WIDTH, 0],
      [COURT_HALF_WIDTH, 0],
      [COURT_HALF_WIDTH, COURT_HALF_LENGTH],
      [-COURT_HALF_WIDTH, COURT_HALF_LENGTH],
    ];
    const texturedNear = this.assets.fillFloor(
      ctx,
      nearCourt.map(([x, y]) => cam.projectFloor(x, y)),
    );
    const texturedFar = this.assets.fillFloor(
      ctx,
      farCourt.map(([x, y]) => cam.projectFloor(x, y)),
    );
    if (!texturedNear) fillQuad(ctx, cam, nearCourt, COURT_NEAR);
    if (!texturedFar) fillQuad(ctx, cam, farCourt, COURT_NEAR);

    if (!this.assets.hasFloor) this.drawGrain(ctx, cam, outX, outY);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  drawNet(ctx: CanvasRenderingContext2D, cam: Camera): void {
    const W = COURT_HALF_WIDTH;"""
          new = """  drawNet(ctx: CanvasRenderingContext2D, cam: Camera): void {
    if (this.assets.drawNet(ctx, cam)) return;
    const W = COURT_HALF_WIDTH;"""
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add persistent art validation
        run: |
          cat > tools/validate-art-assets.ts <<'TS'
          import { existsSync, readFileSync } from 'node:fs';

          interface PngInfo {
            width: number;
            height: number;
            bitDepth: number;
            colourType: number;
          }

          function pngInfo(path: string): PngInfo {
            if (!existsSync(path)) throw new Error(`missing asset: ${path}`);
            const data = readFileSync(path);
            const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
            if (!data.subarray(0, 8).equals(signature)) throw new Error(`${path}: not a PNG`);
            if (data.toString('ascii', 12, 16) !== 'IHDR') throw new Error(`${path}: missing IHDR`);
            return {
              width: data.readUInt32BE(16),
              height: data.readUInt32BE(20),
              bitDepth: data[24],
              colourType: data[25],
            };
          }

          function expectPng(
            path: string,
            width: number,
            height: number,
            colourType?: number,
          ): void {
            const info = pngInfo(path);
            if (info.width !== width || info.height !== height) {
              throw new Error(`${path}: expected ${width}x${height}, got ${info.width}x${info.height}`);
            }
            if (info.bitDepth !== 8) throw new Error(`${path}: expected 8-bit PNG`);
            if (colourType !== undefined && info.colourType !== colourType) {
              throw new Error(`${path}: expected PNG colour type ${colourType}, got ${info.colourType}`);
            }
            console.log(`${path}: ${info.width}x${info.height}, type ${info.colourType}`);
          }

          const sprites = [
            'idle', 'approach', 'spike', 'block', 'bump',
            'set', 'dive', 'serve', 'jumpServe', 'celebrate',
          ];
          for (const name of sprites) {
            expectPng(`public/sprites/${name}.png`, 3072, 2048, 6);
          }
          expectPng('public/arena/arena-back.png', 2560, 900);
          expectPng('public/arena/arena-floor.png', 1024, 512);
          expectPng('public/arena/net.png', 512, 512, 6);
          TS

          python3 <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['scripts']['assets:check'] = 'tsx tools/validate-art-assets.ts'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          marker = "      - run: npm ci\n\n      - name: Typecheck"
          replacement = "      - run: npm ci\n\n      - name: Validate art assets\n        run: npm run assets:check\n\n      - name: Typecheck"
          assert marker in text
          ci.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Validate code, assets and gameplay build
        run: |
          set -euo pipefail
          npm ci
          npm run assets:check
          npm run typecheck
          npm test
          npx vite build
          npm run sim -- --matches 2 --seed 1337

      - name: Commit completed arena integration
        run: |
          set -euo pipefail
          git config user.name "Codex Arena Engineering"
          git config user.email "noreply@openai.com"
          git add public/arena \
                  src/render/arena-assets.ts \
                  src/render/arena.ts \
                  tools/validate-art-assets.ts \
                  package.json \
                  .github/workflows/ci.yml
          git rm .github/workflows/install-arena-assets.yml
          git commit -m "Add illustrated arena assets with procedural fallback"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary
