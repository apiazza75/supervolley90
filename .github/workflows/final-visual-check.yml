name: Final visual verification

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/final-visual-check.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture an actual serve and rally
        run: npm run shots -- final-shots

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-final-rally-screenshots
          path: final-shots/*.png
          if-no-files-found: error

      - name: Remove one-time workflow
        run: |
          git config user.name "Codex Visual QA"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/final-visual-check.yml
          git commit -m "Complete final visual verification"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary
