name: Codex visual correction pass

on:
  push:
    branches: [codex/visual-overhaul-2026]

permissions:
  contents: write

jobs:
  correct-sprites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-overhaul-2026
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply sprite rendering corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          root = Path('.')

          # ---------------------------------------------------------- sprites.ts
          path = root / 'src/render/sprites.ts'
          text = path.read_text()
          start = text.index('function recolour(sheet: Sheet, hex: string): HTMLCanvasElement {')
          end = text.index('/**\n * Strip the paper.', start)
          replacement = '''function recolour(sheet: Sheet, primary: string, secondary?: string): HTMLCanvasElement {
            const cacheKey = `${primary}|${secondary ?? ''}`;
            const cached = sheet.variants.get(cacheKey);
            if (cached) return cached;

            const src = sheet.canvas;
            const out = document.createElement('canvas');
            out.width = src.width;
            out.height = src.height;
            const ctx = out.getContext('2d', { willReadFrequently: true });
            if (!ctx) return src;
            ctx.drawImage(src, 0, 0);

            const primaryN = parseInt(primary.replace('#', ''), 16);
            const [primaryHue, primarySat] = rgbToHsl(
              (primaryN >> 16) & 255,
              (primaryN >> 8) & 255,
              primaryN & 255,
            );
            const secondaryN = secondary ? parseInt(secondary.replace('#', ''), 16) : primaryN;
            const [secondaryHue, secondarySat] = rgbToHsl(
              (secondaryN >> 16) & 255,
              (secondaryN >> 8) & 255,
              secondaryN & 255,
            );

            const img = ctx.getImageData(0, 0, out.width, out.height);
            const d = img.data;
            const map = new Map<number, number>();
            for (let i = 0; i < out.width * out.height; i++) {
              if (d[i * 4 + 3] < 40) continue;
              const key = (d[i * 4] << 16) | (d[i * 4 + 1] << 8) | d[i * 4 + 2];
              let val = map.get(key);
              if (val === undefined) {
                val = key;
                const [hue, sat, light] = rgbToHsl(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
                let kitDiff = Math.abs(hue - sheet.kitHue);
                if (kitDiff > 180) kitDiff = 360 - kitDiff;

                // The original automatic detector sometimes selected skin as
                // the dominant hue. Restrict the primary swap to the authored
                // royal-blue garment so face, arms and legs never change team.
                if (sat >= 0.24 && kitDiff <= 28) {
                  const [r, g, b] = hslToRgb(primaryHue, Math.max(primarySat * 0.82, sat), light);
                  val = (r << 16) | (g << 8) | b;
                } else if (
                  secondary &&
                  sat >= 0.32 &&
                  hue >= 48 &&
                  hue <= 74 &&
                  light >= 0.12 &&
                  light <= 0.86
                ) {
                  // Gold/yellow piping becomes the team's secondary colour.
                  // Skin is warmer and remains outside this narrow range.
                  const [r, g, b] = hslToRgb(
                    secondaryHue,
                    Math.max(secondarySat * 0.78, Math.min(0.92, sat)),
                    light,
                  );
                  val = (r << 16) | (g << 8) | b;
                }
                map.set(key, val);
              }
              if (val === key) continue;
              d[i * 4] = (val >> 16) & 255;
              d[i * 4 + 1] = (val >> 8) & 255;
              d[i * 4 + 2] = val & 255;
            }
            ctx.putImageData(img, 0, 0);
            sheet.variants.set(cacheKey, out);
            return out;
          }

          /** The sheet's canvas painted in a team's two-colour kit. */
          export function kitCanvas(
            sheet: Sheet,
            primary: string,
            secondary?: string,
          ): HTMLCanvasElement {
            return recolour(sheet, primary, secondary);
          }

          '''
          text = text[:start] + replacement + text[end:]

          marker = '/** Cut a cut-out sheet on an exact grid. No searching, nothing to remove. */\nfunction sliceCutOut('
          index = text.index(marker)
          cleanup = '''/**
           * Remove white matte connected to a transparent cell exterior.
           *
           * The generated figures carry real alpha, but some cells also contain
           * a white slab between the legs and a pale silhouette halo. Those
           * pixels are near-white and reachable from the transparent exterior
           * without crossing the dark line art. Flooding that region removes
           * the matte while preserving enclosed socks, numbers and jersey trim.
           */
          function clearExteriorWhite(
            ctx: CanvasRenderingContext2D,
            sx: number,
            sy: number,
            w: number,
            h: number,
          ): void {
            const img = ctx.getImageData(sx, sy, w, h);
            const d = img.data;
            const seen = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0;
            let tail = 0;

            const traversable = (i: number): boolean => {
              const a = d[i * 4 + 3];
              if (a < 16) return true;
              return d[i * 4] > 215 && d[i * 4 + 1] > 215 && d[i * 4 + 2] > 208;
            };
            const push = (i: number): void => {
              if (i < 0 || i >= w * h || seen[i] || !traversable(i)) return;
              seen[i] = 1;
              queue[tail++] = i;
            };

            for (let x = 0; x < w; x++) {
              push(x);
              push((h - 1) * w + x);
            }
            for (let y = 0; y < h; y++) {
              push(y * w);
              push(y * w + w - 1);
            }

            while (head < tail) {
              const i = queue[head++];
              const x = i % w;
              const y = (i / w) | 0;
              if (d[i * 4 + 3] >= 16) {
                d[i * 4] = 0;
                d[i * 4 + 1] = 0;
                d[i * 4 + 2] = 0;
                d[i * 4 + 3] = 0;
              }
              if (x > 0) push(i - 1);
              if (x < w - 1) push(i + 1);
              if (y > 0) push(i - w);
              if (y < h - 1) push(i + w);
              if (x > 0 && y > 0) push(i - w - 1);
              if (x < w - 1 && y > 0) push(i - w + 1);
              if (x > 0 && y < h - 1) push(i + w - 1);
              if (x < w - 1 && y < h - 1) push(i + w + 1);
            }

            ctx.putImageData(img, sx, sy);
          }

          '''
          text = text[:index] + cleanup + text[index:]
          text = replace_once(
              text,
              '''      const sx = c * CUT_OUT_CELL;
                    const sy = r * CUT_OUT_CELL;
                    const m = measure(ctx, sx, sy, CUT_OUT_CELL, CUT_OUT_CELL);''',
              '''      const sx = c * CUT_OUT_CELL;
                    const sy = r * CUT_OUT_CELL;
                    clearExteriorWhite(ctx, sx, sy, CUT_OUT_CELL, CUT_OUT_CELL);
                    const m = measure(ctx, sx, sy, CUT_OUT_CELL, CUT_OUT_CELL);''',
              'cut-out cleanup call',
          )
          text = replace_once(
              text,
              '''    dominantHue(ctx, frames),
                  CUT_OUT_BODY_HEIGHT,''',
              '''    225,
                  CUT_OUT_BODY_HEIGHT,''',
              'strict kit hue',
          )
          text = replace_once(
              text,
              '''  facing = 1,
                kit?: string,
              ): void {''',
              '''  facing = 1,
                primary?: string,
                secondary?: string,
                widthScale = 1,
              ): void {''',
              'drawFrame signature',
          )
          text = replace_once(
              text,
              '''  ctx.translate(x, y);
                ctx.scale(facing, 1);
                ctx.drawImage(
                  kit ? kitCanvas(sheet, kit) : sheet.canvas,''',
              '''  ctx.translate(x, y);
                ctx.scale(facing * widthScale, 1);
                ctx.drawImage(
                  primary ? kitCanvas(sheet, primary, secondary) : sheet.canvas,''',
              'drawFrame palette',
          )
          path.write_text(text)

          # --------------------------------------------------- sprite-figure.ts
          path = root / 'src/render/sprite-figure.ts'
          text = path.read_text()
          text = replace_once(
              text,
              '''export interface Playhead {
                action: SpriteAction;
                /** Zero-based, 0..23. */
                frame: number;
              }''',
              '''export interface Playhead {
                action: SpriteAction;
                /** Zero-based, 0..23. */
                frame: number;
                /** Adjacent frame used for temporal interpolation. */
                nextFrame: number;
                /** Smooth blend from frame to nextFrame, 0..1. */
                blend: number;
              }''',
              'playhead interface',
          )
          text = replace_once(
              text,
              '''function frameAt(action: SpriteAction, t: number): number {
                const span = DURATION[action];
                const u = ONESHOT.has(action) ? clamp(t / span, 0, 0.999) : (t / span) % 1;
                return Math.floor(u * 24);
              }''',
              '''function frameAt(action: SpriteAction, t: number): Omit<Playhead, 'action'> {
                const span = DURATION[action];
                const raw = ONESHOT.has(action)
                  ? clamp((t / span) * 24, 0, 23.999)
                  : ((t / span) * 24) % 24;
                const frame = Math.floor(raw);
                const nextFrame = ONESHOT.has(action) ? Math.min(23, frame + 1) : (frame + 1) % 24;
                const f = raw - frame;
                const blend = f * f * (3 - 2 * f);
                return { frame, nextFrame, blend };
              }''',
              'continuous frame sampler',
          )
          text = replace_once(
              text,
              '''      return { action: h.action, frame };''',
              '''      return { action: h.action, frame, nextFrame: frame, blend: 0 };''',
              'exact contact frame',
          )
          text = replace_once(
              text,
              '''      const frame = frameAt(h.action, h.t);
                    if (h.t >= DURATION[h.action]) h.forced = false;
                    return { action: h.action, frame };''',
              '''      const sampled = frameAt(h.action, h.t);
                    if (h.t >= DURATION[h.action]) h.forced = false;
                    return { action: h.action, ...sampled };''',
              'forced sampled frame',
          )
          text = replace_once(
              text,
              '''    return { action: h.action, frame: frameAt(h.action, h.t) };''',
              '''    return { action: h.action, ...frameAt(h.action, h.t) };''',
              'normal sampled frame',
          )
          text = replace_once(
              text,
              '''  dt: number,
                kit?: string,
                actionHint?: SpriteAction,
              ): boolean {''',
              '''  dt: number,
                primary?: string,
                secondary?: string,
                actionHint?: SpriteAction,
              ): boolean {''',
              'sprite player signature',
          )
          text = replace_once(
              text,
              '''  // The art of a jumping action already contains the lift, so the
                // sprite is planted on the floor and the drawing does the rising.
                const lift = sheet.layout.artHasLift ? 0 : p.height;
                const feet = cam.project(p.pos.x, p.pos.y, lift);
                const bodyPx = 1.9 * feet.scale * 42;
                if (bodyPx < 6) return true;

                ctx.save();
                ctx.globalAlpha = 1 - clamp((p.pos.x + 4.5) / 9, 0, 1) * 0.09;
                drawFrame(ctx, sheet, head.frame, feet.x, feet.y, bodyPx, p.facing >= 0 ? 1 : -1, kit);
                ctx.restore();
                return true;''',
              '''  // The sheets contain only a small authored lift. Suppressing the
                // simulated jump made spikes, blocks and jump serves look grounded.
                const lift = p.height * (sheet.layout.artHasLift ? 0.88 : 1);
                const feet = cam.project(p.pos.x, p.pos.y, lift);

                const roleHeight: Record<Player['role'], number> = {
                  setter: 0.97,
                  outside: 1,
                  opposite: 1.025,
                  middle: 1.06,
                  libero: 0.93,
                };
                const idJitter = (((p.id * 17) % 9) - 4) * 0.008;
                const bodyPx = 1.9 * feet.scale * 42 * (roleHeight[p.role] + idJitter);
                const widthScale =
                  (p.role === 'middle' ? 0.96 : p.role === 'libero' ? 0.91 : 1) +
                  (((p.id * 29) % 7) - 3) * 0.012;
                if (bodyPx < 6) return true;

                const alpha = 1 - clamp((p.pos.x + 4.5) / 9, 0, 1) * 0.09;
                const facing = p.facing >= 0 ? 1 : -1;
                ctx.save();
                // Blend adjacent authored poses at display refresh rate. At the
                // on-court size the overlap reads as controlled motion blur.
                if (head.blend < 0.015 || head.frame === head.nextFrame) {
                  ctx.globalAlpha = alpha;
                  drawFrame(
                    ctx, sheet, head.frame, feet.x, feet.y, bodyPx, facing,
                    primary, secondary, widthScale,
                  );
                } else {
                  ctx.globalAlpha = alpha * (1 - head.blend);
                  drawFrame(
                    ctx, sheet, head.frame, feet.x, feet.y, bodyPx, facing,
                    primary, secondary, widthScale,
                  );
                  ctx.globalAlpha = alpha * head.blend;
                  drawFrame(
                    ctx, sheet, head.nextFrame, feet.x, feet.y, bodyPx, facing,
                    primary, secondary, widthScale,
                  );
                }
                ctx.restore();
                return true;''',
              'sprite draw implementation',
          )
          path.write_text(text)

          # -------------------------------------------------------- renderer.ts
          path = root / 'src/render/renderer.ts'
          text = path.read_text()
          text = replace_once(
              text,
              '''if (this.useSprites && drawSpritePlayer(ctx, cam, ghost, this.sheets, dt, kit[0])) {''',
              '''if (
                        this.useSprites &&
                        drawSpritePlayer(ctx, cam, ghost, this.sheets, dt, kit[0], kit[1])
                      ) {''',
              'replay two-colour kit',
          )
          text = replace_once(
              text,
              '''                dt,
                                kit[0],
                                serverHint ?? bufferedHint,''',
              '''                dt,
                                kit[0],
                                kit[1],
                                serverHint ?? bufferedHint,''',
              'live two-colour kit',
          )
          path.write_text(text)

          # ---------------------------------------------------- sprite tests
          path = root / 'tests/sprites.test.ts'
          text = path.read_text()
          text = replace_once(
              text,
              '''      expect(timeline.frameFor(p, 0)).toEqual({ action, frame });''',
              '''      expect(timeline.frameFor(p, 0)).toEqual({
                        action,
                        frame,
                        nextFrame: frame,
                        blend: 0,
                      });''',
              'contact expectation',
          )
          text = replace_once(
              text,
              '''    expect(timeline.frameFor(p, 0)).toEqual({ action: 'set', frame: 11 });''',
              '''    expect(timeline.frameFor(p, 0)).toEqual({
                      action: 'set',
                      frame: 11,
                      nextFrame: 11,
                      blend: 0,
                    });''',
              'set expectation',
          )
          marker = "  it('distinguishes standing and jump serves', () => {"
          if marker not in text:
              raise SystemExit('interpolation test marker not found')
          text = text.replace(
              marker,
              '''  it('interpolates adjacent poses without moving the contact frame', () => {
                const p = player();
                const timeline = new SpriteTimeline();
                const head = timeline.frameFor(p, 0.05);
                expect(head.action).toBe('idle');
                expect(head.nextFrame).toBe((head.frame + 1) % 24);
                expect(head.blend).toBeGreaterThan(0);
                expect(head.blend).toBeLessThan(1);
              });

          ''' + marker,
              1,
          )
          path.write_text(text)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and simulation tests
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Commit verified corrections
        shell: bash
        run: |
          rm -f .github/workflows/codex-export-worktree.yml
          rm -f .github/workflows/codex-visual-sprite-fix.yml
          git config user.name "Codex"
          git config user.email "noreply@openai.com"
          git add src/render/sprites.ts src/render/sprite-figure.ts src/render/renderer.ts tests/sprites.test.ts .github/workflows
          git commit -m "Fix sprite matte, team palettes, motion and jump lift"
          git push origin HEAD:codex/visual-overhaul-2026
