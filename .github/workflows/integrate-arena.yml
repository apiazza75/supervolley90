name: Integrate illustrated Super Volley arena

on:
  push:
    branches:
      - claude/volley-2d-macos-game-cl9ary
    paths:
      - .github/workflows/integrate-arena.yml

permissions:
  contents: write

jobs:
  integrate:
    name: Install arena art, test and commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download and validate arena archive
        env:
          ARENA_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-1a24-8243-91f7-4f697590adac/raw?se=2026-08-06T00:55:14Z&sp=r&sv=2026-02-06&sr=b&scid=3eb5142c-c650-51ed-a9ce-7bf52f18c0d6&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T21:00:55Z&ske=2026-08-06T21:00:55Z&sks=b&skv=2026-02-06&sig=PQ/5FVTWRsOHdP4W6KFrZu%2BSKIbS7P3yHAouAUk3di4%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors "$ARENA_URL" -o /tmp/supervolley-arena.zip
          unzip -t /tmp/supervolley-arena.zip
          rm -rf /tmp/supervolley-arena
          mkdir -p /tmp/supervolley-arena public/arena
          unzip -o /tmp/supervolley-arena.zip -d /tmp/supervolley-arena

          python3 <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'arena-back.png': (2560, 900, 2),
              'arena-floor.png': (1024, 512, 2),
              'net.png': (512, 512, 6),
          }
          root = Path('/tmp/supervolley-arena')
          assert sorted(p.name for p in root.glob('*.png')) == sorted(expected)
          for name, (want_w, want_h, want_type) in expected.items():
              data = (root / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              assert data[12:16] == b'IHDR', name
              width, height, depth, colour_type = struct.unpack('>IIBB', data[16:26])
              assert (width, height) == (want_w, want_h), (name, width, height)
              assert depth == 8, (name, depth)
              assert colour_type == want_type, (name, colour_type)
              assert len(data) > 10_000, (name, len(data))
              print(f'{name}: {width}x{height}, colour type {colour_type}, {len(data)} bytes')
          PY

          cp /tmp/supervolley-arena/*.png public/arena/

      - name: Add optional illustrated-arena renderer
        run: |
          set -euo pipefail
          cat > src/render/arena-art.ts <<'TS'
          import type { Camera } from './camera';

          type LoadedImage = ImageBitmap | HTMLImageElement;

          export interface SourceRect {
            sx: number;
            sy: number;
            sw: number;
            sh: number;
          }

          export interface DestinationRect {
            x: number;
            y: number;
            width: number;
            height: number;
          }

          /** Source crop that fills a destination without distorting the artwork. */
          export function coverSourceRect(
            sourceWidth: number,
            sourceHeight: number,
            destinationWidth: number,
            destinationHeight: number,
          ): SourceRect {
            const sourceAspect = sourceWidth / sourceHeight;
            const destinationAspect = destinationWidth / destinationHeight;
            if (sourceAspect > destinationAspect) {
              const sw = sourceHeight * destinationAspect;
              return { sx: (sourceWidth - sw) / 2, sy: 0, sw, sh: sourceHeight };
            }
            const sh = sourceWidth / destinationAspect;
            return { sx: 0, sy: (sourceHeight - sh) / 2, sw: sourceWidth, sh };
          }

          /** Screen rectangle for the narrow, side-on authored net. */
          export function netDestinationRect(
            centreX: number,
            top: number,
            bottom: number,
            worldUnitPixels: number,
          ): DestinationRect {
            const width = Math.max(22, worldUnitPixels * 0.78);
            return { x: centreX - width / 2, y: top, width, height: Math.max(1, bottom - top) };
          }

          function fromUrl(src: string): Promise<HTMLImageElement> {
            return new Promise((resolve, reject) => {
              const image = new Image();
              image.onload = () => resolve(image);
              image.onerror = () => reject(new Error(`could not decode ${src}`));
              image.src = src;
            });
          }

          async function decode(url: string): Promise<LoadedImage> {
            try {
              const response = await fetch(url);
              if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
              const blob = await response.blob();
              if (typeof createImageBitmap === 'function') return await createImageBitmap(blob);
              const objectUrl = URL.createObjectURL(blob);
              try {
                return await fromUrl(objectUrl);
              } finally {
                URL.revokeObjectURL(objectUrl);
              }
            } catch (error) {
              console.warn(`[arena-art] fetch failed for ${url}, loading directly:`, error);
              return fromUrl(url);
            }
          }

          /**
           * Optional illustrated arena layers. Every method returns false until
           * its asset is ready, so the procedural arena remains a safe fallback.
           */
          export class ArenaArtwork {
            private backdrop?: LoadedImage;
            private floor?: LoadedImage;
            private net?: LoadedImage;
            private readonly floorPatterns = new WeakMap<CanvasRenderingContext2D, CanvasPattern>();

            constructor(base = 'arena') {
              void this.load(base);
            }

            private async load(base: string): Promise<void> {
              const resolve = (name: string): string =>
                new URL(`${base}/${name}`, document.baseURI).href;
              const [backdrop, floor, net] = await Promise.allSettled([
                decode(resolve('arena-back.png')),
                decode(resolve('arena-floor.png')),
                decode(resolve('net.png')),
              ]);
              if (backdrop.status === 'fulfilled') this.backdrop = backdrop.value;
              if (floor.status === 'fulfilled') this.floor = floor.value;
              if (net.status === 'fulfilled') this.net = net.value;
            }

            drawBackdrop(ctx: CanvasRenderingContext2D, width: number, height: number): boolean {
              const image = this.backdrop;
              if (!image) return false;
              const source = coverSourceRect(image.width, image.height, width, height);
              ctx.drawImage(
                image,
                source.sx,
                source.sy,
                source.sw,
                source.sh,
                0,
                0,
                width,
                height,
              );
              return true;
            }

            drawCourtFloor(
              ctx: CanvasRenderingContext2D,
              cam: Camera,
              halfWidth: number,
              halfLength: number,
            ): boolean {
              const image = this.floor;
              if (!image) return false;
              let pattern = this.floorPatterns.get(ctx);
              if (!pattern) {
                pattern = ctx.createPattern(image, 'repeat') ?? undefined;
                if (!pattern) return false;
                this.floorPatterns.set(ctx, pattern);
              }
              const points = [
                cam.projectFloor(-halfWidth, -halfLength),
                cam.projectFloor(halfWidth, -halfLength),
                cam.projectFloor(halfWidth, halfLength),
                cam.projectFloor(-halfWidth, halfLength),
              ];
              ctx.save();
              ctx.beginPath();
              points.forEach((point, index) => {
                if (index === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
              });
              ctx.closePath();
              ctx.clip();
              ctx.globalAlpha = 0.94;
              ctx.fillStyle = pattern;
              ctx.fillRect(0, 0, cam.viewWidth, cam.viewHeight);
              ctx.restore();
              return true;
            }

            drawNet(
              ctx: CanvasRenderingContext2D,
              centreX: number,
              top: number,
              bottom: number,
              worldUnitPixels: number,
            ): boolean {
              const image = this.net;
              if (!image) return false;
              const target = netDestinationRect(centreX, top, bottom, worldUnitPixels);
              // The authored file has transparent room around a central narrow net.
              ctx.drawImage(image, 205, 5, 102, 493, target.x, target.y, target.width, target.height);
              return true;
            }
          }
          TS

          cat > src/render/arena-art.test.ts <<'TS'
          import { describe, expect, it } from 'vitest';
          import { coverSourceRect, netDestinationRect } from './arena-art';

          describe('illustrated arena geometry', () => {
            it('centre-crops a panoramic backdrop into a 16:9 viewport', () => {
              const crop = coverSourceRect(2560, 900, 1280, 720);
              expect(crop.sx).toBeCloseTo(480);
              expect(crop.sy).toBe(0);
              expect(crop.sw).toBeCloseTo(1600);
              expect(crop.sh).toBe(900);
            });

            it('does not crop a backdrop with the destination aspect ratio', () => {
              expect(coverSourceRect(2560, 900, 1280, 450)).toEqual({
                sx: 0,
                sy: 0,
                sw: 2560,
                sh: 900,
              });
            });

            it('keeps a side-on net narrow and vertically anchored', () => {
              const rect = netDestinationRect(640, 120, 650, 50);
              expect(rect.width).toBeCloseTo(39);
              expect(rect.x).toBeCloseTo(620.5);
              expect(rect.y).toBe(120);
              expect(rect.height).toBe(530);
            });
          });
          TS

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/render/arena.ts')
          text = path.read_text(encoding='utf-8')

          old = "import { Camera } from './camera';"
          new = "import { ArenaArtwork } from './arena-art';\nimport { Camera } from './camera';"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  /** Rises after a point and decays, making the stand come alive. */\n  private excitement = 0;"
          new = "  /** Rises after a point and decays, making the stand come alive. */\n  private excitement = 0;\n  /** Optional illustrated layers; procedural drawing remains the fallback. */\n  private readonly artwork = new ArenaArtwork();"
          assert old in text
          text = text.replace(old, new, 1)

          old = """    // Flat fills, deliberately: gradients read as a lit 3D scene, and this
    // game is meant to read as a drawn 2D one.
    ctx.fillStyle = '#10182b';
    ctx.fillRect(0, 0, w, h);

    this.drawCrowd(ctx, cam, time);
    this.drawRoof(ctx, cam);
    this.drawShafts(ctx, cam, time);
    this.drawBarrier(ctx, cam);
    this.drawFloor(ctx, cam);
    this.drawRibbon(ctx, cam, time);"""
          new = """    const illustrated = this.artwork.drawBackdrop(ctx, w, h);
    if (!illustrated) {
      // Flat procedural fallback: always available when an asset is absent.
      ctx.fillStyle = '#10182b';
      ctx.fillRect(0, 0, w, h);
      this.drawCrowd(ctx, cam, time);
      this.drawRoof(ctx, cam);
    }

    // Dynamic light still belongs to the game and sits over either backdrop.
    this.drawShafts(ctx, cam, time);
    if (!illustrated) this.drawBarrier(ctx, cam);
    this.drawFloor(ctx, cam);
    if (!illustrated) this.drawRibbon(ctx, cam, time);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = "    this.drawGrain(ctx, cam, outX, outY);\n    this.drawLightPools(ctx, cam, outX, outY);"
          new = """    if (!this.artwork.drawCourtFloor(ctx, cam, COURT_HALF_WIDTH, COURT_HALF_LENGTH)) {
      this.drawGrain(ctx, cam, outX, outY);
    }
    this.drawLightPools(ctx, cam, outX, outY);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    const footFar = cam.project(W, 0, 0).y;
    const footNear = cam.project(-W, 0, 0).y;

    ctx.save();"""
          new = """    const footFar = cam.project(W, 0, 0).y;
    const footNear = cam.project(-W, 0, 0).y;
    const antennaTop = Math.min(
      cam.project(W, 0, ANTENNA_HEIGHT).y,
      cam.project(-W, 0, ANTENNA_HEIGHT).y,
    );

    if (this.artwork.drawNet(ctx, cx, antennaTop, footNear, u)) return;

    ctx.save();"""
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace(
            "Everything is procedural, so the build stays asset-free and the court is\n * razor sharp at any resolution — including the 2x backing store a Retina Mac\n * gives us.",
            "Illustrated layers are loaded when present; the procedural arena remains\n * a complete fallback. Court lines, lighting and match reactions stay live and\n * razor sharp at any resolution, including a Retina Mac backing store.",
            1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Typecheck, unit tests, web build and simulation
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run sim -- --matches 2 --seed 1337

      - name: Capture real rendered match frames
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run shots -- /tmp/supervolley-arena-shots

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-arena-screenshots
          path: /tmp/supervolley-arena-shots/*.png
          if-no-files-found: error

      - name: Commit illustrated arena and integration
        run: |
          set -euo pipefail
          git config user.name "Codex Arena Engineering"
          git config user.email "noreply@openai.com"
          git add public/arena/arena-back.png \
                  public/arena/arena-floor.png \
                  public/arena/net.png \
                  src/render/arena-art.ts \
                  src/render/arena-art.test.ts \
                  src/render/arena.ts
          git rm .github/workflows/integrate-arena.yml
          git commit -m "Add illustrated arena art with procedural fallback"
          git push origin HEAD:claude/volley-2d-macos-game-cl9ary

  macos-verify:
    name: Build and package the macOS app
    needs: integrate
    runs-on: macos-latest
    steps:
      - name: Check out the committed branch
        uses: actions/checkout@v4
        with:
          ref: claude/volley-2d-macos-game-cl9ary
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri application
        run: |
          set -euo pipefail
          npm ci
          npm run app:build

      - name: Ad-hoc sign, verify and package
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          app="macos/Super Volley 90.app"
          test -d "$app"
          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1)"
          test -n "$binary"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p verified-dmg
          hdiutil create -volname "Super Volley 90" -srcfolder "$app" \
            -ov -format UDZO verified-dmg/SuperVolley90.dmg
          tar -czf SuperVolley90-macos-app.tar.gz -C macos "Super Volley 90.app"

      - name: Upload verified macOS build
        uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-macos-illustrated-arena
          path: |
            src-tauri/target/release/bundle/verified-dmg/SuperVolley90.dmg
            src-tauri/target/release/bundle/SuperVolley90-macos-app.tar.gz
          if-no-files-found: error
