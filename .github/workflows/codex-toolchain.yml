name: Codex toolchain export

on:
  push:
    branches:
      - codex/visual-overhaul-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package Node toolchain
        run: tar -czf /tmp/supervolley90-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: supervolley90-node-modules
          path: /tmp/supervolley90-node-modules.tar.gz
          if-no-files-found: error
