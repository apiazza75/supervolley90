name: Codex worktree export

on:
  push:
    branches:
      - codex/visual-overhaul-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository worktree
        run: |
          tar --exclude=.git -czf /tmp/supervolley90-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: supervolley90-codex-worktree
          path: /tmp/supervolley90-worktree.tar.gz
          if-no-files-found: error
