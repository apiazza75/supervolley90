name: Apply verified visual overhaul

on:
  push:
    branches:
      - codex/visual-overhaul-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify text-only overhaul payload
        env:
          PAYLOAD_SHA256: f4cbd8becbe24ab68c62e650b526899d115ade3139ec764e94cb672362f61ceb
        run: |
          set -euo pipefail
          cat \
            .codex/payload.part00 \
            .codex/payload.part01 \
            .codex/payload.part02 \
            .codex/payload.part03 \
            .codex/payload.part04 \
            .codex/payload.part05 \
            .codex/payload.part06 \
            README.md \
            package.json \
            .github/workflows/ci.yml \
            | base64 --decode > /tmp/sv90-text-overhaul.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/sv90-text-overhaul.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/sv90-text-overhaul.tar.gz

      - name: Install complete text overhaul and remove transfer scaffolding
        run: |
          set -euo pipefail
          tar -xzf /tmp/sv90-text-overhaul.tar.gz -C .
          rm -rf .codex
          rm -f .github/workflows/codex-export-worktree.yml

      - run: npm ci

      - name: Validate code, simulation and production bundle
        run: |
          npm run assets:check
          npm run typecheck
          npm test
          npm run build

      - name: Capture visual-overhaul evidence
        run: |
          npx playwright install --with-deps chromium
          npm run shots:overhaul -- visual-overhaul-shots

      - name: Upload visual-overhaul evidence
        uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-visual-overhaul-evidence
          path: visual-overhaul-shots
          if-no-files-found: error

      - name: Commit verified overhaul and retire one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-apply-visual-overhaul.yml
          git config user.name "Codex Visual Systems"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Super Volley 90 visual system"
          git push origin HEAD:codex/visual-overhaul-2026
