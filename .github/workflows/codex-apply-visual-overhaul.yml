name: Apply complete visual overhaul

on:
  push:
    branches:
      - codex/visual-overhaul-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and verify visual overhaul payload
        env:
          PAYLOAD_SHA256: 6f1b20a5b593ad079d85a9ab13b9446abe8b3f5194dec9ca4de6e5521dba2a97
        run: |
          set -euo pipefail
          test "$(find .codex -maxdepth 1 -name 'payload.part*' | wc -l | tr -d ' ')" = "7"
          cat .codex/payload.part00 .codex/payload.part01 .codex/payload.part02 \
              .codex/payload.part03 .codex/payload.part04 .codex/payload.part05 \
              .codex/payload.part06 > /tmp/sv90-text-overhaul.b64
          base64 --decode /tmp/sv90-text-overhaul.b64 > /tmp/sv90-text-overhaul.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/sv90-text-overhaul.tar.gz" | sha256sum --check --strict

      - name: Apply production code and retire superseded arena bitmaps
        run: |
          set -euo pipefail
          tar -xzf /tmp/sv90-text-overhaul.tar.gz -C .
          rm -f public/arena/arena-back.png public/arena/arena-floor.png public/arena/net.png

      - run: npm ci

      - name: Normalise production sprite palette masks
        run: npx tsx tools/normalise-sprite-masks.ts

      - name: Validate generated assets and code
        run: |
          npm run assets:check
          npm run typecheck
          npm test
          npm run build

      - name: Commit complete overhaul
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/codex-apply-visual-overhaul.yml
          git config user.name "Codex Visual Systems"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rebuild Super Volley 90 visual system"
          git push origin HEAD:codex/visual-overhaul-2026
