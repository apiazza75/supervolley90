name: Apply verified visual overhaul

on:
  push:
    branches:
      - codex/visual-overhaul-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download and verify complete visual-overhaul worktree
        env:
          PAYLOAD_URL: https://api.onedrive.com/v1.0/shares/u!aHR0cHM6Ly91ZmZpY2lvc2VydmljZS1teS5zaGFyZXBvaW50LmNvbS86dTovZy9wZXJzb25hbC9hbGVzc2FuZHJvX3BpYXp6YV91ZmZpY2lvc2VydmljZV9pdC9JUUQwQWp5dTNHQUlSYXowRGhFUEx5MHhBUlJOZUxhY3RRdkF1bTZHOVhuYnpyRQ/root/content
          PAYLOAD_SHA256: 526338586d5b6ff2a58ae3a732285fef17b34b35603cff53ec430df9eaef4e05
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (GitHub Actions)' \
            "$PAYLOAD_URL" -o /tmp/sv90-visual-overhaul-2026.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/sv90-visual-overhaul-2026.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/sv90-visual-overhaul-2026.tar.gz | head -40

      - name: Install complete worktree and remove transfer scaffolding
        run: |
          set -euo pipefail
          tar -xzf /tmp/sv90-visual-overhaul-2026.tar.gz -C .
          rm -rf .codex
          rm -f .github/workflows/codex-export-worktree.yml

      - run: npm ci

      - name: Install pixel-level QA dependencies
        run: python3 -m pip install --quiet pillow numpy scipy

      - name: Validate assets, code, simulation and production bundle
        run: |
          npm run assets:check
          npm run assets:quality
          npm run typecheck
          npm test
          npm run build

      - name: Capture visual-overhaul evidence
        run: |
          npx playwright install --with-deps chromium
          npm run shots:overhaul -- visual-overhaul-shots

      - name: Upload visual-overhaul evidence
        uses: actions/upload-artifact@v4
        with:
          name: SuperVolley90-visual-overhaul-evidence
          path: visual-overhaul-shots
          if-no-files-found: error

      - name: Commit verified overhaul and retire this one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-apply-visual-overhaul.yml
          git config user.name "Codex Visual Systems"
          git config user.email "noreply@openai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rebuild Super Volley 90 visual system"
          git push origin HEAD:codex/visual-overhaul-2026
